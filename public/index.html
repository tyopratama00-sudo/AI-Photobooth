let actx=null;
function getAudio(){if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(A)actx=new A()}if(actx&&actx.state==='suspended')actx.resume();return actx}
function sfxTone(f,type='sine',d=0.08,v=0.18){try{const a=getAudio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime);g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch{}}
function sfxMelody(notes,speed=0.08,type='triangle',v=0.18){try{const a=getAudio();if(!a)return;notes.forEach((f,i)=>{setTimeout(()=>sfxTone(f,type,speed*1.2,v),i*speed*1000)})}catch{}}
function sfxShutter(){try{const a=getAudio();if(!a)return;sfxTone(1600,'square',0.03,0.25);setTimeout(()=>{const bs=Math.floor(a.sampleRate*0.09),b=a.createBuffer(1,bs,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<bs;i++)d[i]=Math.random()*2-1;const n=a.createBufferSource();n.buffer=b;const fl=a.createBiquadFilter();fl.type='bandpass';fl.frequency.value=1200;const g=a.createGain();g.gain.setValueAtTime(0.35,a.currentTime);g.gain.exponentialRampToValueAtTime(0.01,a.currentTime+0.09);n.connect(fl);fl.connect(g);g.connect(a.destination);n.start();setTimeout(()=>sfxTone(900,'triangle',0.04,0.2),70)},40)}catch{}}
